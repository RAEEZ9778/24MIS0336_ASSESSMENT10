apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-waste-portal
  labels:
    app: food-waste-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-waste-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: food-waste-portal
    spec:
      containers:
        - name: food-waste-portal
          image: YOUR_DOCKERHUB_USERNAME/food-waste-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: food-waste-portal
spec:
  type: NodePort
  selector:
    app: food-waste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
